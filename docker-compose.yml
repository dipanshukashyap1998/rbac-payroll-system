services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rbac-payroll-app
    ports:
      - "80:8080"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor

  db:
    image: mysql:8.0
    container_name: rbac-payroll-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: rbac_payroll
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
