name: Auto Merge to Main

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-to-main
  cancel-in-progress: true

jobs:
  merge-and-push:
    name: Merge branch into main
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch != 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Merge branch into main and push
        run: |
          set -euo pipefail

          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main "$BRANCH"

          if git diff --quiet origin/main.."origin/$BRANCH"; then
            echo "No changes to promote from $BRANCH to main."
            exit 0
          fi

          git checkout -B main origin/main
          git merge --no-ff --no-edit "origin/$BRANCH"
          git push origin HEAD:main
