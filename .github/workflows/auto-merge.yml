name: Auto Merge Develop to Main

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - develop
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-develop-to-main
  cancel-in-progress: true

jobs:
  merge-and-push:
    name: Merge develop into main
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge develop into main and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main develop

          if git diff --quiet origin/main..origin/develop; then
            echo "No changes to promote from develop to main."
            exit 0
          fi

          git checkout -B main origin/main
          git merge --no-ff --no-edit origin/develop
          git push origin HEAD:main
